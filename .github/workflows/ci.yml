name: CI

on:
  push:
    branches: [prodV2]
  pull_request:
    branches: [prodV2]
  workflow_dispatch:

env:
  COMPOSE_SERVICE: agromelio-frontend
  SOURCE_DIR: agro-agromelio-frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:ci

      - name: Lint
        run: npm run lint

  deploy:
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/prodV2'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Убираем CRLF (иначе OpenSSH: «Load key: error in libcrypto»)
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null || { echo "::error::SSH_PRIVATE_KEY повреждён или не PEM/OpenSSH — пересоздайте секрет"; exit 1; }
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rsync sources to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SOURCES_PATH: ${{ secrets.SOURCES_PATH }}
        run: |
          # node_modules и dist на сервере не нужны: Quasar build выполняется внутри multi-stage Dockerfile.prod.
          rsync -az --delete \
            --exclude='.git' --exclude='node_modules' --exclude='.venv' \
            --exclude='target' --exclude='dist' --exclude='.idea' --exclude='.pytest_cache' \
            -e "ssh -p ${SSH_PORT:-22} -i ~/.ssh/id_ed25519" \
            ./ "${SSH_USER}@${SSH_HOST}:${SOURCES_PATH}/${SOURCE_DIR}/"

      - name: Build & up on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            # PUBLIC_BASE_URL подхватывается из deploy/.env через docker compose substitution
            # и попадает в build-args Dockerfile.prod (см. блок agromelio-frontend в compose).
            docker compose -f docker-compose.prod.yml build "${{ env.COMPOSE_SERVICE }}"
            docker compose -f docker-compose.prod.yml up -d --no-deps "${{ env.COMPOSE_SERVICE }}"
            docker image prune -f || true
