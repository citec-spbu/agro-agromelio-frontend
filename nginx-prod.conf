server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Не кешировать index.html, чтобы при выкатке нового бандла браузер увидел свежие имена чанков.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires off;
        try_files /index.html =404;
    }

    # Hashed-чанки от Vite — иммутабельны, кешируем агрессивно.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
